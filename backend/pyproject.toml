[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thesis-workflow-backend"
version = "0.1.0"
description = "FastAPI backend for the thesis workflow MVP"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.10.0",
  "sqlalchemy>=2.0.38",
  "alembic>=1.16.0",
  "asyncpg>=0.30.0",
  "redis>=5.2.1",
  "temporalio>=1.11.0",
  "boto3>=1.39.0",
  "python-multipart>=0.0.20",
  "websockets>=15.0.1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.1",
  "pytest-asyncio>=1.1.0",
  "httpx>=0.28.1",
  "anyio>=4.10.0",
  "ruff>=0.12.10"
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
